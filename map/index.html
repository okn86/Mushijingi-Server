<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ワールドマップ</title>
<style>
    :root { color-scheme: dark; --line: rgba(255,255,255,.1); --dim: rgba(255,255,255,.38); --accent: #00e5a0; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; padding: 26px 24px 64px;
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 16px; line-height: 1.8; color: #f4f4f5; background: #0a0a0c;
        -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    img { display: block; max-width: 100%; }

    .back {
        display: inline-flex; align-items: center; gap: 7px;
        margin-bottom: 46px; padding: 7px 13px 7px 10px;
        font-size: 13px; font-weight: 700; text-decoration: none;
        color: var(--dim); border: 1px solid var(--line); border-radius: 5px;
    }
    .back:hover { color: #f4f4f5; background: rgba(255,255,255,.06); }

    h1 {
        margin: 0 0 14px; padding-bottom: 14px;
        font-size: clamp(25px, 3.8vw, 34px); font-weight: 800; letter-spacing: .01em;
        line-height: 1.25; border-bottom: 1px solid var(--line);
    }
    .lead { max-width: 60ch; margin: 0 0 44px; font-size: 15.5px; color: rgba(255,255,255,.58); }

    .dims { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 20px; }
    .dim { display: block; text-decoration: none; color: inherit; }
    .dim-shot {
        display: block; aspect-ratio: 4 / 3; margin-bottom: 14px; overflow: hidden;
        background: #0e0e11; border: 1px solid var(--line); border-radius: 5px;
    }
    .dim-shot img {
        width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated;
        transition: transform .5s cubic-bezier(.22,.8,.3,1), filter .3s;
    }
    .dim:hover .dim-shot img { transform: scale(1.05); filter: brightness(1.08); }
    .dim b { display: block; font-size: 16px; font-weight: 700; transition: color .18s; }
    .dim:hover b { color: var(--accent); }
    .dim-note { display: block; margin-top: 3px; font-size: 13px; color: var(--dim); }
    .dim-date {
        display: block; margin-top: 6px;
        font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
        color: rgba(255,255,255,.3); font-variant-numeric: tabular-nums;
    }

    /* 「いつの地図か」。地形が古いのではと迷わせないよう見出しのすぐ下に置く。 */
    .updated {
        display: inline-flex; align-items: center; gap: 8px;
        margin: 16px 0 18px; padding: 5px 13px 5px 11px;
        font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
        color: rgba(255,255,255,.72);
        border: 1px solid var(--line); border-radius: 999px;
        font-variant-numeric: tabular-nums;
    }
    .updated-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,.16);
    }

    @media (max-width: 620px) {
        body { padding: 18px 16px 52px; }
        .back { margin-bottom: 30px; }
        .lead { margin-bottom: 32px; }
        h1 { padding-bottom: 12px; }
        .dims { gap: 18px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="../">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        サイトに戻る
    </a>
    <h1>ワールドマップ</h1>
    <p class="updated"><span class="updated-dot"></span>ワールドデータ 2026年8月11日 時点</p>
    <p class="lead">見たいディメンションを選んでください。地点をタップすると名前と座標が表示されます。</p>
    <div class="dims">
        <a class="dim" href="overworld/">
            <span class="dim-shot"><img src="../img/map-overworld.jpg" alt="" loading="lazy"></span>
            <span class="dim-body">
                <b>オーバーワールド</b>
                <span class="dim-date">2026-08-11 時点</span>
            </span>
        </a>
        <a class="dim" href="nether/">
            <span class="dim-shot"><img src="../img/map-nether.jpg" alt="" loading="lazy"></span>
            <span class="dim-body">
                <b>ネザー</b>
                <span class="dim-date">2026-08-08 時点</span>
            </span>
        </a>
        <a class="dim" href="end/">
            <span class="dim-shot"><img src="../img/map-end.jpg" alt="" loading="lazy"></span>
            <span class="dim-body">
                <b>エンド</b>
                <span class="dim-date">2026-08-08 時点</span>
            </span>
        </a>
    </div>
</div>
</body>
</html>
